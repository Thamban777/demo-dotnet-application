name: Diagnose Project Paths
on:
  push:
    branches: [ "main" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List all files
        run: |
          echo "=== ROOT DIRECTORY ==="
          ls -la
          echo ""
          echo "=== All .csproj files (full paths) ==="
          find . -name "*.csproj" -type f
          echo ""
          echo "=== Check if TodoApi.csproj exists ==="
          test -f "./dotnet/TodoApi/TodoApi.csproj" && echo "✓ Found: ./dotnet/TodoApi/TodoApi.csproj" || echo "✗ NOT FOUND: ./dotnet/TodoApi/TodoApi.csproj"
          test -f "./TodoApi/TodoApi.csproj" && echo "✓ Found: ./TodoApi/TodoApi.csproj" || echo "✗ NOT FOUND: ./TodoApi/TodoApi.csproj"