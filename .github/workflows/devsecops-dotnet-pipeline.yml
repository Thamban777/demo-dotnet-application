name: Build and Analyze .NET Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch depth 0 is required for Sonar analysis
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Or your specific .NET version

    # Optional: Restore dependencies if needed
    # - name: Restore dependencies
    #   run: dotnet restore

    - name: SonarScanner for .NET
      uses: highbyte/sonarscan-dotnet@v2.5.0
      with:
        sonarProjectKey: todo-app
        sonarProjectName: todo-app
        # The following parameters are crucial for the Quality Gate check:
        sonarQualityGateWait: true # Fails the step if the QG fails
        # Optional: set a timeout in seconds for the QG check (default is 300s)
        # sonarQualityGateTimeout: 300 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # SONAR_HOST_URL is optional for SonarCloud, required for SonarQube self-hosted
        # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
