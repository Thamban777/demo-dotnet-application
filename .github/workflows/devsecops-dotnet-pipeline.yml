name: DevSecOps Pipeline - .NET + SonarQube

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0'

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup .NET
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Create Solution (FIXED)
      - name: Create Solution File
        run: |
          echo "Creating solution..."
          dotnet new sln -o .
          echo "Adding projects..."
          dotnet sln add ./TodoApi/TodoApi.csproj
          dotnet sln add ./TodoApi.Tests/TodoApi.Tests.csproj
          echo "Files after creation:"
          ls -la

      # 4. Install SonarScanner
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      # 5. Add PATH
      - run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # 6. Restore (IMPORTANT CHANGE)
      - name: Restore
        run: dotnet restore *.sln

      # 7. Sonar Begin
      - name: Sonar Begin
        run: |
          dotnet sonarscanner begin \
            /k:"todo-app" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      # 8. Build
      - name: Build
        run: dotnet build *.sln --no-restore

      # 9. Test
      - name: Test
        run: |
          dotnet test *.sln \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover

      # 10. Sonar End
      - name: Sonar End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # 11. Quality Gate
      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
